name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate the app
        run: npm test
      - name: Build the pinned Philippine boundary package
        run: npm run boundaries:full
      - name: Stage the static app and generated map data
        run: |
          mkdir -p _site/data
          cp index.html styles.css LICENSE README.md _site/
          cp -R src assets docs _site/
          cp data/source_metadata.json _site/data/
          cp -R data/generated _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
